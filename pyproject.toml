[project]
name = "crawl_github_starred"
version = "0.1.0"
description = "Crawl GitHub for starred items"
requires-python =">=3.11"
dependencies = [
    "requests==2.31.0",
    "stamina==24.3.0",
    "structlog>=25.2.0",
    "pytest>=8.4.0",
]

[project.scripts]
crawl-github = "crawl_github_starred.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"